name: Run Tests on Push

on:
	push:
		branches:
			-feature-branch #main
jobs:
	tests:
		runs-on: windows-latests
		steps:
			-name: Checkout code
			 uses: actions/checkout@v3

			-name: Set up Node.js
			uses: actions/setup-node@v3
			 with:
				node-version: '16'

			-name: Install dependencies
			 run: |
				npm install

			-name: Run tests
			 run: |
				npm tests