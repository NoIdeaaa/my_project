name: Run Tests on Push

on:
  push:
    branches:
      - feature-branch  # Remove the `#main` comment or fix it

jobs:
  tests:
    runs-on: windows-latest  # Corrected the typo in 'windows-latests'

    steps:
      - name: Checkout code  # Corrected indentation
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install

      - name: Run tests
        run: |
          npm test  # Corrected `npm tests` to `npm test`
